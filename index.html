}}

<script>
/*LOGIC-START*/
const WD=["dom","seg","ter","qua","qui","sex","sáb"],MO=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const pad=n=>String(n).padStart(2,"0");
const toDate=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d))};
const addDays=(s,n)=>new Date(toDate(s).getTime()+n*864e5).toISOString().slice(0,10);
const diffDays=(a,b)=>Math.round((toDate(b)-toDate(a))/864e5);
const dayLabel=s=>{const d=toDate(s);return WD[d.getUTCDay()]+" "+pad(d.getUTCDate())};
const longLabel=s=>{const d=toDate(s);return dayLabel(s)+" "+MO[d.getUTCMonth()]};

function buildPlan(b,today){
  const first=b.firstPage||1,last=b.lastPage,total=last-first+1,n=b.days||7,log=b.log||{};
  const dates=Array.from({length:n},(_,i)=>addDays(b.startDate,i));
  const before=d=>{let r=first-1;for(const k in log)if(k<d&&log[k]>r)r=log[k];return r};
  const reached=Object.values(log).reduce((a,c)=>Math.max(a,c),first-1);
  const finished=reached>=last;
  const end=dates[n-1];
  const anchor=today<dates[0]?dates[0]:today>end?end:today;
  const ai=dates.indexOf(anchor);
  const baseEnd=i=>Math.min(last,first-1+Math.ceil(total*(i+1)/n));
  const start=before(anchor);
  const anchorTo=Math.min(last,start+Math.ceil(Math.max(0,last-start)/(n-ai)));
  let cursor=start,futMax=first-1;
  for(let j=ai+1;j<n;j++){const v=log[dates[j]];if(v>futMax)futMax=v}
  const laterMax=i=>{let r=first-1,by=-1;for(let j=i+1;j<n;j++){const v=log[dates[j]];if(v>r){r=v;by=j}}return[r,by]};
  const days=dates.map((date,i)=>{
    let from,to,status,by=-1;const logged=log[date];
    if(i<ai){
      from=before(date)+1;
      if(logged>=from){to=logged;status="done"}
      else if(from>last||from>baseEnd(i)){to=from-1;status="free"}
      else{to=Math.min(last,Math.max(baseEnd(i),from));const lm=laterMax(i);if(lm[0]>=to){status="ahead";by=lm[1]}else status="missed"}
    }else{
      from=cursor+1;to=Math.min(last,cursor+Math.ceil(Math.max(0,last-cursor)/(n-i)));
      const lm=laterMax(i);
      if(logged>=from&&logged>=to){status="done";to=Math.max(to,logged);cursor=to}
      else if(logged>=from){status="partial";cursor=logged}
      else if(from>last){status="free";to=from-1}
      else if(lm[0]>=to){status="ahead";by=lm[1];cursor=to}
      else{status=i===ai?"pending":"future";cursor=to}
    }
    return{date,index:i,from,to,pages:Math.max(0,to-from+1),status,logged,by,isToday:date===today};
  });
  const expected=ai>0?baseEnd(ai-1):first-1;
  const missed=days.filter(d=>d.status==="missed").length;
  return{dates,days,first,last,total,n,reached,finished,anchor,ai,
    read:reached-first+1,left:last-reached,perDay:Math.ceil(total/n),
    todayPages:days[ai].pages,behind:expected-Math.max(start,futMax),missed,
    notStarted:today<dates[0],overdue:today>end&&!finished,
    finishDate:finished?Object.keys(log).filter(k=>log[k]>=last).sort()[0]:null};
}
/*LOGIC-END*/

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const CHECK='<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7.5l3.2 3.2L12 3.8"/></svg>';
const DOT='<svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="currentColor"/></svg>';
const CHEV='<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l6 6-6 6"/></svg>';
const PLUS='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const GLASSES='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="7" cy="14" r="3.6"/><circle cx="17" cy="14" r="3.6"/><path d="M10.6 13.2c.9-.8 1.9-.8 2.8 0M3.4 13 2 10.5M20.6 13 22 10.5"/></svg>';
const pg=n=>n+(n===1?" página":" páginas");

const S={books:[],ready:false,sel:null,day:null,editing:null,error:"",note:"",store:null,local:false};
const LKEY="livro-da-semana";
const cache=()=>{try{localStorage.setItem(LKEY,JSON.stringify(S.books))}catch(e){S.note="Não consegui salvar no celular: o espaço acabou. Remova a capa de algum livro antigo."}};
const uncache=()=>{try{return JSON.parse(localStorage.getItem(LKEY)||"[]")}catch(e){return[]}};

const queues={};
function persist(b){
  cache();
  if(!S.store)return;
  const {id,...data}=b;
  queues[id]=(queues[id]||Promise.resolve()).then(()=>S.store.doc(id).set(data)).catch(failSave);
}
function removeBook(id){
  S.books=S.books.filter(b=>b.id!==id);cache();
  if(S.store)(queues[id]||Promise.resolve()).then(()=>S.store.doc(id).delete()).catch(failSave);
}
function failSave(e){
  S.note=e&&e.code==="quota_exceeded"?"A estante está cheia. Apague um livro para liberar espaço.":"Não consegui salvar a última alteração. Confira a conexão e tente de novo.";
  render();
}
function update(b){
  const i=S.books.findIndex(x=>x.id===b.id);
  if(i<0)S.books.push(b);else S.books[i]=b;
  persist(b);render();
}
const clone=b=>JSON.parse(JSON.stringify(b));
const byStart=(a,b)=>a.startDate<b.startDate?-1:a.startDate>b.startDate?1:0;

function groups(today){
  const open=[],done=[];
  for(const b of S.books)(buildPlan(b,today).finished?done:open).push(b);
  open.sort((a,b)=>(a.example?1:0)-(b.example?1:0)||byStart(a,b));
  done.sort((a,b)=>byStart(a,b));
  return{open,done};
}
function nextStart(today){
  const real=S.books.filter(b=>!b.example&&!buildPlan(b,today).finished);
  let d=today;
  for(const b of real){const e=addDays(b.startDate,b.days||7);if(e>d)d=e}
  return d;
}

function pill(p){
  if(p.finished)return["ok","Livro concluído"];
  if(p.notStarted)return["","Ainda não começou"];
  if(p.overdue)return["warn","Prazo terminou"];
  if(p.missed>0)return["warn",p.missed+(p.missed===1?" dia perdido":" dias perdidos")];
  if(p.behind>0)return["warn",p.behind+" pág. atrás"];
  if(p.behind<0)return["ok",-p.behind+" pág. à frente"];
  return["ok","Em dia"];
}
function adviceFor(p){
  if(p.finished||p.notStarted||p.overdue)return"";
  if(p.todayPages>p.perDay)return"A meta subiu de "+p.perDay+" para "+p.todayPages+" páginas por dia para você terminar no prazo.";
  if(p.todayPages<p.perDay&&p.todayPages>0&&p.behind<0)return"Você adiantou. A meta caiu de "+p.perDay+" para "+p.todayPages+" páginas por dia.";
  return"";
}
function spine(b,i){
  const w=Math.round(Math.max(24,Math.min(58,(b.lastPage-(b.firstPage||1)+1)/9)));
  if(b.cover)return'<button class="spine cvsp" data-act="open" data-id="'+esc(b.id)+'" style="background-image:url(\''+esc(b.cover)+'\')" aria-label="'+esc(b.title)+'"></button>';
  return'<button class="spine" data-act="open" data-id="'+esc(b.id)+'" style="width:'+w+'px;background:var(--sp'+(i%5+1)+')" aria-label="'+esc(b.title)+'">'+esc(b.title)+"</button>";
}
function shelfHtml(done){
  const year=todayISO().slice(0,4);
  const count=done.filter(b=>buildPlan(b,todayISO()).finishDate?.startsWith(year)).length;
  const firsts=S.books.filter(b=>!b.example&&!b.manual).map(b=>b.startDate).sort();
  const weeks=firsts.length?Math.max(1,Math.ceil((diffDays(firsts[0],todayISO())+1)/7)):0;
  const ghosts=Array.from({length:Math.max(0,5-done.length)},()=>'<div class="ghost" aria-hidden="true"></div>').join("");
  const line=done.length?count+(count===1?" livro terminado":" livros terminados")+" em "+year+(weeks?", em "+weeks+(weeks===1?" semana":" semanas")+" de leitura.":"."):"Cada livro terminado entra aqui.";
  return'<section class="sec"><h4>Estante</h4><div class="shelf">'+done.map(spine).join("")+ghosts+'</div><p class="note">'+line+"</p></section>"+readHtml();
}

function readHtml(){
  const today=todayISO(),now=today.slice(0,4);
  const rows=S.books.map(b=>({b,p:buildPlan(b,today)})).filter(x=>x.p.finished).map(x=>({...x,date:x.p.finishDate})).sort((a,c)=>a.date<c.date?1:-1);
  const years=[...new Set([now,...rows.map(r=>r.date.slice(0,4))])].sort().reverse();
  const y=years.includes(S.year)?S.year:now;
  const list=rows.filter(r=>r.date.startsWith(y));
  const pages=list.reduce((a,r)=>a+r.p.total,0);
  const chips=years.length>1?'<div class="years">'+years.map(v=>'<button class="year" data-act="year" data-year="'+v+'" aria-pressed="'+(v===y)+'">'+v+"</button>").join("")+"</div>":"";
  const items=list.map(r=>'<button class="q" data-act="open" data-id="'+esc(r.b.id)+'"><span>'+esc(r.b.title)+"<small>"+esc(r.b.author||"Autor não informado")+"</small></span><span class=\"side\">"+longLabel(r.date)+"<br>"+(r.b.rating?"★".repeat(r.b.rating):r.p.total+" págs.")+"</span></button>").join("");
  return'<section class="sec"><h4>Livros lidos</h4>'+chips+'<div class="total"><strong>'+list.length+(list.length===1?" livro":" livros")+" em "+y+'</strong><span class="note">'+pages.toLocaleString("pt-BR")+" páginas lidas</span></div>"+items+'<button class="link" data-act="addread" style="align-self:flex-start">Adicionar livro que já li</button></section>';
}
function render(){
  const root=$("root"),dock=$("dock"),today=todayISO();
  if(!S.ready)return;
  const{open,done}=groups(today);
  let b=S.books.find(x=>x.id===S.sel)||open[0]||null;
  const topbar='<div class="top"><h1><span class="mark" aria-hidden="true">'+GLASSES+'</span>Livro da Semana</h1><button class="icon" data-act="new" aria-label="Adicionar livro">'+PLUS+"</button></div>"+installHtml();
  if(!b){
    const lastDone=done[done.length-1];
    root.innerHTML=topbar+'<div class="book"><h2>'+(lastDone?"Qual é o próximo livro?":"Qual é o livro desta semana?")+'</h2><p class="note">Coloque o nome e o número de páginas. O app divide a leitura em 7 dias e ajusta a meta se você atrasar.</p></div>'+shelfHtml(done)+footHtml();
    dock.hidden=false;$("cta").textContent="Adicionar livro";$("cta").dataset.act="new";$("cta").className="";
    return;
  }
  S.sel=b.id;
  const p=buildPlan(b,today);
  if(!S.day||!p.dates.includes(S.day))S.day=p.anchor;
  const d=p.days[p.dates.indexOf(S.day)];
  const[pc,pt]=pill(p);
  const tiles=p.days.map(x=>{
    const c=[x.status==="missed"?"missed":"",x.status==="partial"?"partial":"",x.isToday?"today":""].join(" ");
    const mark=(x.status==="done"||x.status==="ahead")?CHECK:(x.status==="missed"||x.status==="partial")?DOT:"";
    const lab=dayLabel(x.date);
    return'<button class="tile '+c+'" data-act="day" data-date="'+x.date+'" aria-pressed="'+(x.date===S.day)+'" aria-label="Dia '+(x.index+1)+", "+lab+'"><b>'+(x.index+1)+"</b><span>"+(x.isToday?"hoje":lab)+"</span>"+(mark?"<i>"+mark+"</i>":"")+"</button>";
  }).join("");

  let task="";
  const canLog=d.status!=="free"&&d.status!=="ahead";
  if(d.status==="free"){
    task='<p class="note">'+(p.finished?"Nada para ler neste dia. O livro já terminou.":"Sem leitura neste dia.")+"</p>";
  }else{
    const on=d.status==="done"||d.status==="ahead",part=d.status==="partial";
    const sub=d.status==="ahead"?"Já lida quando você marcou o dia "+(d.by+1)+". Para desfazer, desmarque o dia "+(d.by+1)+"."
      :on?(d.isToday?"Leitura de hoje feita":d.index>p.ai?"Leitura adiantada":"Leitura feita")
      :part?"Você parou na página "+d.logged+". Faltam "+pg(d.to-d.logged)+" da meta."
      :d.status==="missed"?"Dia sem leitura registrada. Marque se você leu."
      :d.status==="future"?pg(d.pages)+" previstas. Se já leu, pode marcar."
      :pg(d.pages)+(p.notStarted?" no primeiro dia":" hoje");
    task='<button class="task '+(on?"on":"")+(on&&S.pop===d.date?" pop":"")+(part?" part":"")+'" data-act="tick" '+(canLog?"":"disabled")+' aria-pressed="'+on+'"><span class="ring">'+(on?CHECK:"")+"</span><span><strong>pp. "+d.from+"–"+d.to+"</strong><small>"+sub+"</small></span></button>";
    if(canLog)task+='<form class="stop" id="stopForm"><label for="stopPage">Parei em outra página</label><input class="num" id="stopPage" type="number" inputmode="numeric" min="'+d.from+'" max="'+p.last+'" placeholder="'+(d.logged||d.to)+'"><button class="btn2" type="submit">Salvar</button></form>';
    if(S.error)task+='<p class="err">'+esc(S.error)+"</p>";
  }
  const advice=adviceFor(p);
  const pct=Math.round(p.read/p.total*100);
  const extend=p.overdue?'<p class="note warn">Faltam '+pg(p.left)+'. Termine hoje ou estenda o prazo. <button class="link" data-act="extend">Mais 3 dias</button></p>':"";
  const rate=p.finished?'<div class="rate"><div class="stars" role="group" aria-label="Sua nota">'+[1,2,3,4,5].map(n=>'<button class="star'+(n<=(b.rating||0)?" on":"")+'" data-act="rate" data-n="'+n+'" aria-label="'+n+(n===1?" estrela":" estrelas")+'">★</button>').join("")+'</div><div class="f"><label for="bookNote">Anotações sobre o livro</label><textarea id="bookNote">'+esc(b.note||"")+"</textarea></div></div>":"";
  const others=open.filter(x=>x.id!==b.id);
  const queue=others.length?'<section class="sec"><h4>Próximos livros</h4>'+others.map(x=>{const q=buildPlan(x,today);return'<button class="q" data-act="open" data-id="'+esc(x.id)+'"><span>'+esc(x.title)+"<small>"+longLabel(x.startDate)+", "+q.perDay+" págs. por dia</small></span>"+CHEV+"</button>"}).join("")+"</section>":"";

  root.innerHTML=topbar
   +'<div class="hero'+(b.cover?" hc":"")+'">'+(b.cover?'<div class="herobg" style="background-image:url(\''+esc(b.cover)+'\')"></div>':"")
   +'<div class="book'+(b.cover?" hc":"")+'">'+(b.cover?'<img class="cover" alt="" src="'+esc(b.cover)+'">':"")+'<div class="bt"><h2>'+esc(b.title)+'</h2><div class="meta">'
   +(b.author?"<span>"+esc(b.author)+"</span>":"")+"<span>"+p.total+" páginas</span><span>"+(p.finished?"Lido em "+longLabel(p.finishDate):dayLabel(p.dates[0])+" a "+longLabel(p.dates[p.n-1]))+"</span>"
   +(b.example?'<span class="chip">Exemplo</span>':"")+'<button class="link" data-act="edit">Editar</button></div>'
   +(b.example?'<p class="note">Este livro é só um exemplo. Ele some quando você adicionar o seu primeiro livro.</p>':"")+"</div></div></div>"
   +(b.manual?rate:'<div class="strip" id="strip">'+tiles+"</div>"
   +'<div class="head"><h3>Dia '+(d.index+1)+" de "+p.n+'</h3><span class="pill '+pc+'">'+pt+"</span></div>"
   +(advice?'<p class="note'+(p.todayPages>p.perDay?" warn":"")+'">'+advice+"</p>":"")
   +"<div>"+task+"</div>"+extend+rate)
   +'<div class="prog"><div class="row"><span>'+Math.max(0,p.read)+" de "+p.total+" páginas</span><span>"+pct+'%</span></div><div class="bar"><i style="width:'+pct+'%"></i></div></div>'
   +queue+shelfHtml(done)+footHtml();
  const sel=root.querySelector('.tile[aria-pressed="true"]');
  if(sel){const st=$("strip");st.scrollLeft=sel.offsetLeft-st.offsetLeft-(st.clientWidth-sel.offsetWidth)/2}

  const cta=$("cta");dock.hidden=false;cta.className="";
  if(p.finished&&open.length){cta.textContent="Voltar para o livro atual";cta.dataset.act="current";cta.className="soft"}
  else if(p.finished){cta.textContent="Escolher o próximo livro";cta.dataset.act="new"}
  else if(d.status==="ahead"){const nx=p.days.find(x=>x.index>d.index&&(x.status==="future"||x.status==="pending"||x.status==="partial"));if(nx){cta.textContent="Ir para o dia "+(nx.index+1);cta.dataset.act="day";cta.dataset.date=nx.date}else{cta.textContent="Voltar para hoje";cta.dataset.act="home"}cta.className="soft"}
  else if(d.status==="free"){cta.textContent="Voltar para hoje";cta.dataset.act="home";cta.className="soft"}
  else if(d.status==="done"){cta.textContent="Desfazer esta leitura";cta.dataset.act="tick";cta.className="soft"}
  else{cta.textContent="Li até a página "+d.to;cta.dataset.act="tick"}
}
let deferredInstall=null;
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const hideInstall=()=>{try{return localStorage.getItem("livro-install-hide")==="1"}catch(e){return false}};
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;render()});
addEventListener("appinstalled",()=>{deferredInstall=null;render()});
function installHtml(){
  if(standalone()||hideInstall()||!(deferredInstall||isIOS()))return"";
  return'<div class="install"><span class="mark" aria-hidden="true">'+GLASSES+'</span><p>Instale o app<small>Abre direto da tela inicial e funciona sem internet.</small></p><button class="btn2" type="button" data-act="install">Instalar</button><button class="x" type="button" data-act="installhide" aria-label="Fechar aviso">×</button></div>';
}
function burst(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const r=document.querySelector(".task.pop .ring");if(!r)return;
  const b=r.getBoundingClientRect(),cols=["var(--brand)","var(--warn)","var(--sp3)","var(--sp4)","var(--sp5)"];
  for(let i=0;i<14;i++){const s=document.createElement("i");s.className="burst";const a=Math.PI*2*i/14;
    s.style.cssText="left:"+(b.left+b.width/2-4)+"px;top:"+(b.top+b.height/2-4)+"px;background:"+cols[i%5]+";--dx:"+Math.round(Math.cos(a)*(40+Math.random()*30))+"px;--dy:"+Math.round(Math.sin(a)*(40+Math.random()*30))+"px";
    document.body.appendChild(s);setTimeout(()=>s.remove(),900)}
}
function footHtml(){
  const t=S.note||(S.local?"Seus livros ficam salvos só neste aparelho.":"Salvo na sua conta.");
  return'<section class="sec"><h4>Backup</h4><p class="note">Copie o backup de vez em quando e guarde numa nota. Ele também serve para passar seus livros para outro aparelho: copie num, cole no outro e toque em Restaurar.</p>'
   +'<div class="cvbtns" style="flex-direction:row;flex-wrap:wrap"><button class="btn2" type="button" data-act="bkcopy">Copiar backup</button><button class="btn2" type="button" data-act="bkrestore">Restaurar</button></div>'
   +'<textarea id="bkText" rows="3" aria-label="Texto do backup" placeholder="Cole aqui o backup para restaurar" style="width:100%;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 12px;font:13px/1.4 ui-monospace,monospace;color:inherit"></textarea>'
   +'<p class="note" id="bkMsg" aria-live="polite">'+esc(S.bkMsg||"")+'</p></section><p class="foot">'+esc(t)+"</p>";
}

function currentBook(){return S.books.find(x=>x.id===S.sel)}
function logDay(b,p,d,page){setLog(b,d.index>p.ai&&page>=p.last?p.anchor:d.date,page)}
function setLog(b,date,page){const n=clone(b);n.log=n.log||{};if(page===null)delete n.log[date];else n.log[date]=page;update(n)}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act,b=currentBook(),today=todayISO();
  S.error="";
  if(a==="new")openSheet(null);
  else if(a==="addread")openSheet(null,true);
  else if(a==="edit")openSheet(b,!!b.manual);
  else if(a==="current"){S.sel=null;S.day=null;render();scrollTo(0,0)}
  else if(a==="year"){S.year=t.dataset.year;render()}
  else if(a==="rate"){const n=clone(b),v=Number(t.dataset.n);n.rating=n.rating===v?0:v;update(n)}
  else if(a==="day"){S.day=t.dataset.date;render()}
  else if(a==="home"){S.day=null;render()}
  else if(a==="open"){S.sel=t.dataset.id;S.day=null;render();scrollTo(0,0)}
  else if(a==="install"){
    if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;render()})}
    else if(isIOS()){const s=document.createElement("div");s.className="ios";s.setAttribute("role","dialog");s.setAttribute("aria-label","Como instalar");
      s.innerHTML='<h3>Instalar no iPhone ou iPad</h3><ol><li>Abra este site no <b>Safari</b>.</li><li>Toque em <b>Compartilhar</b>, o quadrado com a seta para cima.</li><li>Toque em <b>Adicionar à Tela de Início</b>.</li><li>Deixe <b>Abrir como App Web</b> ligado e toque em <b>Adicionar</b>.</li></ol><button class="primary" type="button" data-act="iosclose" style="width:100%">Entendi</button>';
      document.body.appendChild(s)}
  }
  else if(a==="iosclose"){t.closest(".ios").remove()}
  else if(a==="installhide"){try{localStorage.setItem("livro-install-hide","1")}catch(err){}render()}
  else if(a==="bkcopy"){
    const txt=JSON.stringify({app:"livro-da-semana",v:1,books:S.books}),ta=$("bkText"),msg=$("bkMsg");ta.value=txt;
    const man=()=>{ta.focus();ta.select();msg.textContent="Texto selecionado. Toque e segure para copiar."};
    try{navigator.clipboard.writeText(txt).then(()=>{msg.textContent="Backup copiado. Cole numa nota e guarde."},man)}catch(err){man()}
  }
  else if(a==="bkrestore"){
    const ta=$("bkText"),msg=$("bkMsg");let d;
    try{d=JSON.parse(ta.value.trim())}catch(err){d=null}
    const list=Array.isArray(d)?d:d&&Array.isArray(d.books)?d.books:null;
    if(!list||!list.every(x=>x&&x.id&&x.title&&x.lastPage&&x.startDate)){msg.textContent="Esse texto não é um backup válido do Livro da Semana.";return}
    S.books=list;cache();S.sel=null;S.day=null;S.bkMsg=list.length+(list.length===1?" livro restaurado.":" livros restaurados.");render();S.bkMsg="";
  }
  else if(a==="extend"){const n=clone(b);n.days=(n.days||7)+3;S.day=today;update(n)}
  else if(a==="tick"){
    const p=buildPlan(b,today),d=p.days[p.dates.indexOf(S.day)];
    if(d.status==="ahead")return;
    if(d.status==="done")setLog(b,d.date,null);
    else{S.pop=d.date;logDay(b,p,d,d.to);S.pop=null;burst()}
  }
});
document.addEventListener("change",e=>{
  if(e.target.id!=="bookNote")return;
  const n=clone(currentBook());n.note=e.target.value;update(n);
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="stopForm")return;
  e.preventDefault();
  const b=currentBook(),p=buildPlan(b,todayISO()),d=p.days[p.dates.indexOf(S.day)];
  const v=parseInt($("stopPage").value,10);
  if(!(v>=d.from&&v<=p.last)){S.error="Digite uma página entre "+d.from+" e "+p.last+".";render();return}
  S.error="";logDay(b,p,d,v);
});

function field(id){return $(id).value.trim()}
function formBook(){
  const first=parseInt(field("fFirst"),10)||1,last=parseInt(field("fLast"),10),start=field("fStart");
  return{first,last,start,valid:!!field("fTitle")&&last>=first&&!!start};
}
function updateCalc(){
  const f=formBook(),c=$("calc");
  if(S.readMode){c.innerHTML='<p class="note">'+(f.last>=f.first&&f.start?"Entra na sua lista de "+f.start.slice(0,4)+".":"Coloque a última página e a data.")+"</p>";$("saveBook").disabled=!f.valid;return}
  if(!(f.last>=f.first)||!f.start){c.innerHTML='<p class="note">Coloque a última página para ver a meta diária.</p>';$("saveBook").disabled=true;return}
  const days=S.editing?.days||7,total=f.last-f.first+1,per=Math.ceil(total/days);
  c.innerHTML="<strong>"+per+" páginas por dia</strong><span class=\"note\">"+total+" páginas em "+days+" dias, de "+dayLabel(f.start)+" a "+longLabel(addDays(f.start,days-1))+"</span>";
  $("saveBook").disabled=!f.valid;
}
function openSheet(b,readMode){
  S.editing=b;S.readMode=!!readMode;
  $("sheetTitle").textContent=b?"Editar livro":readMode?"Livro que já li":"Livro da semana";
  $("fStartLabel").textContent=readMode?"Terminei em":"Primeiro dia de leitura";
  $("fTitle").value=b?.title||"";$("fAuthor").value=b?.author||"";
  $("fFirst").value=b?.firstPage||1;$("fLast").value=b?.lastPage||"";
  const fin=b?buildPlan(b,todayISO()).finishDate:null;
  $("fStart").value=readMode?(fin||todayISO()):(b?.startDate||nextStart(todayISO()));
  $("lookupNote").hidden=true;
  S.cover=b?.cover||"";showCover();$("cvRes").innerHTML="";$("cvNote").hidden=true;
  const del=$("delBook");del.hidden=!b;del.textContent="Apagar este livro";del.dataset.sure="";
  updateCalc();$("sheet").hidden=false;$("sheet").scrollTop=0;
  document.body.style.overflow="hidden";
  if(!b)$("fTitle").focus();
}
function closeSheet(){$("sheet").hidden=true;document.body.style.overflow="";S.editing=null}
$("closeSheet").onclick=closeSheet;
$("bookForm").addEventListener("input",updateCalc);
$("delBook").onclick=()=>{
  const del=$("delBook");
  if(!del.dataset.sure){del.dataset.sure="1";del.textContent="Toque de novo para apagar";return}
  const id=S.editing.id;closeSheet();removeBook(id);S.sel=null;S.day=null;render();
};
$("bookForm").addEventListener("submit",e=>{
  e.preventDefault();
  const f=formBook();if(!f.valid)return;
  const old=S.editing;
  const b=old?clone(old):{id:"b"+Date.now().toString(36),days:7,log:{}};
  if(S.cover)b.cover=S.cover;else delete b.cover;
  Object.assign(b,{title:field("fTitle"),author:field("fAuthor"),firstPage:f.first,lastPage:f.last,startDate:f.start});
  delete b.example;
  if(S.readMode){b.manual=true;b.startDate=addDays(f.start,-6);b.log={[f.start]:f.last}}
  else if(old){const fin=buildPlan(old,todayISO()).finishDate;if(fin)b.log[fin]=f.last}
  const keepView=S.readMode&&!old;
  if(!old)S.books.filter(x=>x.example).map(x=>x.id).forEach(removeBook);
  closeSheet();if(!keepView){S.sel=b.id;S.day=null}update(b);if(!keepView)scrollTo(0,0);
});

/* Capas: busca no Google Books e Open Library, ou foto do celular */
function showCover(){
  const p=$("cvPrev");
  p.innerHTML=S.cover?'<img alt="Capa escolhida" src="'+esc(S.cover)+'">':"Sem capa";
  $("cvDel").hidden=!S.cover;
}
function cvNote(t){const n=$("cvNote");n.hidden=!t;n.textContent=t||""}
function shrink(src){
  return new Promise((ok,no)=>{
    const img=new Image();
    img.onload=()=>{
      const k=Math.min(1,360/img.naturalWidth,540/img.naturalHeight);
      const w=Math.max(1,Math.round(img.naturalWidth*k)),h=Math.max(1,Math.round(img.naturalHeight*k));
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      try{ok(c.toDataURL("image/jpeg",0.78))}catch(e){no(e)}
    };
    img.onerror=()=>no(new Error("img"));
    img.src=src;
  });
}
const b64bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function net(url,kind){
  if(window.AndroidApp&&AndroidApp.get){
    return new Promise(r=>setTimeout(()=>{
      let s="";try{s=AndroidApp.get(url)||""}catch(e){}
      if(!s)return r(null);
      r(kind==="img"?"data:image/jpeg;base64,"+s:new TextDecoder().decode(b64bytes(s)));
    },40));
  }
  return fetch(url).then(x=>{if(!x.ok)return null;return kind==="img"?x.blob().then(bl=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(bl)})):x.text()}).catch(()=>null);
}
async function findCovers(title,author){
  const out=[],seen=new Set();
  const q="intitle:"+title+(author?" inauthor:"+author:"");
  const g=await net("https://www.googleapis.com/books/v1/volumes?q="+encodeURIComponent(q)+"&maxResults=12&printType=books");
  try{
    for(const it of (g&&JSON.parse(g).items)||[]){
      const v=it.volumeInfo||{},il=v.imageLinks||{};
      let u=il.thumbnail||il.smallThumbnail;if(!u)continue;
      u=u.replace(/^http:/,"https:").replace(/&edge=curl/,"");
      if(seen.has(u))continue;seen.add(u);
      out.push({img:u,title:v.title||"",author:(v.authors||[]).join(", "),pages:v.pageCount||0});
    }
  }catch(e){}
  const o=await net("https://openlibrary.org/search.json?title="+encodeURIComponent(title)+(author?"&author="+encodeURIComponent(author):"")+"&limit=12&fields=title,author_name,cover_i,number_of_pages_median");
  try{
    for(const d of (o&&JSON.parse(o).docs)||[]){
      if(!d.cover_i)continue;
      out.push({img:"https://covers.openlibrary.org/b/id/"+d.cover_i+"-M.jpg",big:"https://covers.openlibrary.org/b/id/"+d.cover_i+"-L.jpg",title:d.title||"",author:(d.author_name||[]).join(", "),pages:d.number_of_pages_median||0});
    }
  }catch(e){}
  return{list:out.slice(0,12),failed:g===null&&o===null};
}
let cvFound=[];
$("cvSearch").onclick=async()=>{
  const title=field("fTitle"),btn=$("cvSearch");
  if(!title){cvNote("Digite o nome do livro primeiro.");return}
  btn.disabled=true;btn.textContent="Buscando...";cvNote("Procurando capas. Pode levar alguns segundos.");$("cvRes").innerHTML="";
  const r=await findCovers(title,field("fAuthor"));
  btn.disabled=false;btn.textContent="Buscar capa";
  cvFound=r.list;
  if(r.failed){cvNote("Sem conexão com a internet. Use Tirar foto ou Galeria.");return}
  if(!cvFound.length){cvNote("Não achei a capa desse livro. Use Tirar foto ou Galeria.");return}
  cvNote("Toque na capa certa. Se nenhuma for a sua edição, use Tirar foto.");
  $("cvRes").innerHTML=cvFound.map((c,i)=>'<button type="button" data-i="'+i+'"><img alt="" loading="lazy" src="'+esc(c.img)+'"><span>'+esc(c.title)+"</span><span>"+esc(c.author)+"</span></button>").join("");
};
$("cvRes").onclick=async e=>{
  const bt=e.target.closest("button[data-i]");if(!bt)return;
  const c=cvFound[+bt.dataset.i];if(!c)return;
  cvNote("Salvando a capa...");
  let data=c.big?await net(c.big,"img"):null;
  if(!data)data=await net(c.img,"img");
  try{if(!data)throw 0;S.cover=await shrink(data)}catch(err){S.cover=c.big||c.img}
  showCover();$("cvRes").innerHTML="";
  let msg="Capa escolhida. Ela fica salva quando você tocar em Salvar livro.";
  if(c.pages>0&&!field("fLast")){$("fFirst").value=1;$("fLast").value=c.pages;updateCalc();msg+=" Coloquei "+c.pages+" páginas pela edição encontrada; confira a última página do seu exemplar."}
  cvNote(msg);
};
async function fromFile(inp){
  const f=inp.files&&inp.files[0];inp.value="";if(!f)return;
  cvNote("Preparando a foto...");
  const u=URL.createObjectURL(f);
  try{S.cover=await shrink(u);showCover();$("cvRes").innerHTML="";cvNote("Capa escolhida. Ela fica salva quando você tocar em Salvar livro.")}
  catch(e){cvNote("Não consegui abrir essa imagem. Tente outra.")}
  finally{URL.revokeObjectURL(u)}
}
$("cvCam").onchange=e=>fromFile(e.target);
$("cvGal").onchange=e=>fromFile(e.target);
$("cvDel").onclick=()=>{S.cover="";showCover();cvNote("Capa removida. Toque em Salvar livro para confirmar.")};

let sampleFn=null;
$("lookup").onclick=async()=>{
  const title=field("fTitle"),note=$("lookupNote"),btn=$("lookup");
  note.hidden=false;
  if(!title){note.textContent="Digite o nome do livro primeiro.";return}
  btn.disabled=true;btn.textContent="Procurando...";note.textContent="Isso pode levar até um minuto.";
  try{
    const r=await sampleFn.json('Livro: "'+title.slice(0,200)+'"'+(field("fAuthor")?" de "+field("fAuthor").slice(0,120):"")+'. Informe quantas páginas tem a edição mais comum, de preferência em português do Brasil. Responda apenas com JSON: {"found":true,"author":"nome","pages":320,"edition":"editora ou edição"}. Se não reconhecer o livro com segurança, responda {"found":false}. Não invente.');
    const pages=parseInt(r&&r.pages,10);
    if(r&&r.found&&pages>0){
      $("fFirst").value=1;$("fLast").value=pages;
      if(!field("fAuthor")&&r.author)$("fAuthor").value=String(r.author);
      note.textContent="Estimativa: "+pages+" páginas"+(r.edition?" ("+String(r.edition)+")":"")+". Edições mudam, então confira a última página do seu exemplar.";
      updateCalc();
    }else note.textContent="Não reconheci esse livro. Digite a última página manualmente.";
  }catch(err){
    const c=err&&err.code;
    if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"){$("lookupBox").hidden=true;note.textContent="Busca indisponível. Digite a última página manualmente."}
    else if(c==="rate_limited")note.textContent="Muitas buscas agora. Tente mais tarde ou digite a última página.";
    else note.textContent="A busca falhou. Tente de novo ou digite a última página.";
  }finally{btn.disabled=false;btn.textContent="Buscar número de páginas"}
};

(async()=>{
  const finish=()=>{S.ready=true;render()};
  let loaded=false;
  const timer=setTimeout(()=>{if(!loaded){S.note="Não consegui abrir sua estante ainda. Confira a conexão.";S.books=uncache();finish()}},10000);
  const api=window.claude;
  const db=api?await api.use("db").catch(()=>null):null;
  if(!db){clearTimeout(timer);S.local=true;S.books=uncache();finish()}
  else{
    S.store=db.collection("books");
    S.store.onSnapshot(snap=>{
      const next=snap.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))}));
      const same=JSON.stringify(next)===JSON.stringify(S.books);
      if(!snap.metadata.fromCache){loaded=true;clearTimeout(timer);if(S.note.startsWith("Não consegui abrir"))S.note=""}
      if(!snap.metadata.fromCache||next.length){
        S.books=next;cache();
        const active=document.activeElement;
        if(!S.ready||(!same&&!(active&&(active.id==="stopPage"||active.id==="bookNote")))){S.ready=true;render()}
      }
    },()=>{clearTimeout(timer);S.local=true;S.store=null;S.books=uncache();S.note="Sem conexão com sua conta. Salvando só neste aparelho.";finish()});
  }
  if(api){
    sampleFn=await api.use("sample").catch(()=>null);
    if(sampleFn)$("lookupBox").hidden=false;
  }
})();

let lastDay=todayISO();
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden&&todayISO()!==lastDay){lastDay=todayISO();S.day=null;render()}
});
